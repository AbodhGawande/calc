<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tote">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<title>Tote</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <div class="topbar">
    <button id="clearBtn" class="tb-btn tb-text" aria-label="Clear page">Clear</button>
    <button id="shareBtn" class="tb-btn" aria-label="Share page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4M8 11H6v10h12V11h-2"/></svg>
    </button>
    <button id="helpBtn" class="tb-btn help-btn" aria-label="Help">?</button>
    <span class="spacer"></span>
    <button id="undoBtn" class="tb-btn off" aria-label="Undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button id="keypadBtn" class="tb-btn accent" aria-label="Show calculator keypad">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M8.5 6.5h7"/><circle cx="9" cy="11" r=".6" fill="currentColor"/><circle cx="12" cy="11" r=".6" fill="currentColor"/><circle cx="15" cy="11" r=".6" fill="currentColor"/><circle cx="9" cy="14.5" r=".6" fill="currentColor"/><circle cx="12" cy="14.5" r=".6" fill="currentColor"/><circle cx="15" cy="14.5" r=".6" fill="currentColor"/><circle cx="9" cy="18" r=".6" fill="currentColor"/><circle cx="12" cy="18" r=".6" fill="currentColor"/><circle cx="15" cy="18" r=".6" fill="currentColor"/></svg>
    </button>
  </div>

  <div id="scroller" class="page">
    <div id="note" class="note" contenteditable="true" inputmode="none" autocorrect="off" autocapitalize="off" spellcheck="false" role="textbox" aria-multiline="true" aria-label="Calculation page"></div>
    <div id="answers" class="answers"></div>
  </div>

  <button id="fxBar" class="fxbar" hidden></button>
  <div id="vars" class="vars" aria-label="Names">
    <button id="nameChip" class="chip name-chip">Name…</button>
    <span id="varChips" class="var-chips"></span>
  </div>

  <section id="keypad" class="keypad">
    <button class="key fn" data-key="abc">ABC</button>
    <button class="key fn" data-key="(">(</button>
    <button class="key fn" data-key=")">)</button>
    <button class="key fn" data-key="back" aria-label="Delete">
      <svg viewBox="0 0 28 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4.5h14a2.5 2.5 0 0 1 2.5 2.5v10a2.5 2.5 0 0 1-2.5 2.5h-14L2.5 12z"/><path d="M13.8 8.8l6.4 6.4M20.2 8.8l-6.4 6.4"/></svg>
    </button>
    <button class="key fn" data-key="%">%</button>
    <button class="key fn" data-key="conv" aria-label="Conversions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h15l-3.5-3.5M20 16H5l3.5 3.5"/></svg>
    </button>
    <button class="key fn enter" data-key="enter" aria-label="New line">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5v6a3 3 0 0 1-3 3H5"/><path d="M9 10l-4 4 4 4"/></svg>
    </button>
    <button class="key op" data-key="/">÷</button>
    <button class="key" data-key="7">7</button>
    <button class="key" data-key="8">8</button>
    <button class="key" data-key="9">9</button>
    <button class="key op" data-key="*">×</button>
    <button class="key" data-key="4">4</button>
    <button class="key" data-key="5">5</button>
    <button class="key" data-key="6">6</button>
    <button class="key op" data-key="-">−</button>
    <button class="key" data-key="1">1</button>
    <button class="key" data-key="2">2</button>
    <button class="key" data-key="3">3</button>
    <button class="key op" data-key="+">+</button>
    <button class="key" data-key="00">00</button>
    <button class="key" data-key="0">0</button>
    <button class="key" data-key=".">.</button>
    <button class="key op" data-key="=">=</button>
  </section>
</main>

<!-- Tap an answer: Use / Name / Copy -->
<div id="menu" class="menu" role="menu" hidden>
  <span id="menuFull" class="menu-full" hidden></span>
  <button data-act="use" role="menuitem">Use</button>
  <button data-act="name" role="menuitem">Name</button>
  <button data-act="copy" role="menuitem">Copy</button>
</div>

<!-- Name box -->
<div id="nameBox" class="namebox" hidden>
  <div class="nb-card">
    <div class="nb-label">Name this number</div>
    <div id="nbValue" class="nb-value"></div>
    <input id="nbInput" class="nb-input" type="text" placeholder="e.g. rent" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" maxlength="24">
    <p id="nbError" class="nb-error" hidden>Use one word that starts with a letter, like rent or rent2.</p>
    <div class="nb-actions">
      <button id="nbRemove" class="nb-remove">Remove name</button>
      <span class="grow"></span>
      <button id="nbCancel" class="nb-cancel">Cancel</button>
      <button id="nbSave" class="nb-save">Save</button>
    </div>
  </div>
</div>

<!-- Help: drawn by help.js -->
<div id="help" class="help" aria-hidden="true" inert>
  <div class="help-head"><h2>How to use Tote</h2><button id="helpDone" class="done">Done</button></div>
  <div id="helpBody" class="help-body"></div>
</div>

<!-- Share -->
<div id="shareSheet" class="sheet" aria-hidden="true" inert>
  <div class="sheet-card">
    <div class="sheet-head"><h2>Share this page</h2><button id="shareDone" class="done">Cancel</button></div>
    <div class="sheet-actions">
      <button id="shareText">As text</button>
      <button id="shareImage">As a picture</button>
    </div>
    <p class="hint">Text pastes back into Tote with its answers stripped, so a note in Messages or Notes doubles as a copy.</p>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>

<!-- Conversions (⇄): filled in by convert.js -->
<div id="convSheet" class="help" aria-hidden="true" inert>
  <div class="help-head"><h2>Convert</h2><button id="convDone" class="done">Done</button></div>
  <div id="convBody" class="help-body conv-body"></div>
</div>

<script src="units.js"></script>
<script src="engine.js"></script>
<script src="rates.js"></script>
<script src="convert.js"></script>
<script src="help.js"></script>
<script src="share.js"></script>
<script src="app.js"></script>
</body>
</html>
